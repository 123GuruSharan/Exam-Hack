<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHL Coding Assessment - Java</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Top Window Title / Tab Bar -->
  <div class="window-tab-bar">
    <div class="browser-tab">
      <span class="tab-title">SHL</span>
      <button class="tab-close-btn" id="tabCloseBtn" aria-label="Close tab">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <line x1="2" y1="2" x2="12" y2="12"></line>
          <line x1="2" y1="12" x2="12" y2="2"></line>
        </svg>
      </button>
    </div>
    <div class="window-controls">
      <button class="window-close-btn" id="windowCloseBtn" aria-label="Close window">✕</button>
    </div>
  </div>

  <!-- Browser Navigation Toolbar -->
  <div class="browser-toolbar">
    <button class="toolbar-btn" id="toolbarBack" title="Back" aria-label="Back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="20" y1="12" x2="4" y2="12"></line>
        <polyline points="12 19 4 12 12 5"></polyline>
      </svg>
    </button>
    <button class="toolbar-btn disabled" id="toolbarForward" title="Forward" aria-label="Forward" disabled>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="12" x2="20" y2="12"></line>
        <polyline points="12 5 20 12 12 19"></polyline>
      </svg>
    </button>
    <button class="toolbar-btn" id="toolbarStop" title="Stop" aria-label="Stop">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="5" x2="5" y2="19"></line>
        <line x1="5" y1="5" x2="19" y2="19"></line>
      </svg>
    </button>
    <button class="toolbar-btn" id="toolbarReload" title="Reload" aria-label="Reload">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 20c-2.67 0-4.62-.58-5.85-1.75C4.72 16.9 4 14.96 4 12.44c0-2.85 1.61-4.98 4.82-6.4L4.1 5.36v-.39L11.69 4l-1.02 7.08h-.41L9.54 6.62C6.46 8.04 4.92 9.98 4.92 12.44c0 2.19.65 3.91 1.95 5.14 1.1 1.03 2.81 1.55 5.13 1.55 2.32 0 4.1-.58 5.33-1.75 1.17-1.1 1.75-2.75 1.75-4.94 0-1.75-1.2-3.59-3.59-5.53l.61-.58c2.6 1.94 3.9 3.97 3.9 6.11 0 2.45-.68 4.33-2.05 5.62C16.58 19.35 14.6 20 12 20z"/>
      </svg>
    </button>
    <span class="toolbar-divider" aria-hidden="true"></span>
    <button class="toolbar-btn" id="toolbarInfo" title="Information" aria-label="Information">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="11.5" stroke-width="2.4"></line>
        <circle cx="12" cy="8" r="1.3" fill="currentColor" stroke="none"></circle>
      </svg>
    </button>
    <span class="toolbar-divider" aria-hidden="true"></span>
    <button class="toolbar-btn" id="toolbarDoc" title="Document" aria-label="Document">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="12" y1="18" x2="12" y2="12" stroke-width="2.2"></line>
        <line x1="9" y1="15" x2="15" y2="15" stroke-width="2.2"></line>
      </svg>
    </button>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="logo" title="SHL">
        <svg class="shl-logo-svg" viewBox="0 0 78 30" width="70" height="27" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="SHL">
          <!-- S -->
          <path d="M 19 5.5 C 10 4 3 6 3 11.5 C 3 18.5 20 16 20 22 C 20 27.5 13 28.8 3 27.5" stroke="#1c1e21" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- H -->
          <path d="M 30 4.5 L 30 27.5 M 43.5 4.5 L 43.5 27.5 M 30 16.5 L 43.5 16.5" stroke="#1c1e21" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- L -->
          <path d="M 53.5 4.5 L 53.5 22.5 C 53.5 26 56 27.5 60 27.5 L 66 27.5" stroke="#1c1e21" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- Lime Dot -->
          <circle cx="70.5" cy="26" r="2" fill="#a4ce3a"/>
        </svg>
      </div>

      <div class="timer" id="timer">30:00</div>

      <div class="top-actions">
        <button class="icon-btn fullscreen-btn" id="fullscreenBtn" title="Fullscreen" aria-label="Fullscreen">
          <svg class="header-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 2H3a1 1 0 0 0-1 1v4"></path>
            <path d="M17 2h4a1 1 0 0 1 1 1v4"></path>
            <path d="M7 22H3a1 1 0 0 1-1-1v-4"></path>
            <path d="M17 22h4a1 1 0 0 0 1-1v-4"></path>
          </svg>
        </button>
        <span class="action-divider" aria-hidden="true"></span>
        <button class="text-btn" id="helpBtn" title="Help" aria-label="Help">
          <svg class="header-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9.5"></circle>
            <path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 3"></path>
            <circle cx="12" cy="16.5" r="0.9" fill="currentColor" stroke="none"></circle>
          </svg>
          <span>Help</span>
        </button>
        <span class="action-divider" aria-hidden="true"></span>
        <button class="text-btn" id="exitBtn" title="Exit" aria-label="Exit">
          <svg class="header-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 4 A 8.5 8.5 0 1 0 13 20"></path>
            <polyline points="14 8 18 12 14 16"></polyline>
            <line x1="7" y1="12" x2="18" y2="12"></line>
          </svg>
          <span>Exit</span>
        </button>
        <span class="action-divider" aria-hidden="true"></span>
        <button class="menu-btn" id="menuBtn" title="Menu" aria-label="Menu">
          <svg width="18" height="15" viewBox="0 0 20 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="2" x2="19" y2="2"></line>
            <line x1="1" y1="8" x2="19" y2="8"></line>
            <line x1="1" y1="14" x2="19" y2="14"></line>
          </svg>
        </button>
      </div>
    </header>

    <main class="workspace">
      <aside class="question-panel">
        <h2>Question</h2>

        <div id="questionContent"></div>
      </aside>

      <section class="coding-panel">
        <div class="editor-toolbar">
          <div class="toolbar-icons">
            <button id="themeBtn" title="Toggle editor theme">◩</button>
            <button id="undoBtn" title="Undo">↶</button>
            <button id="saveBtn" title="Save code">▣</button>
          </div>

          <select id="language">
            <option>Java (8)</option>
            <option>Java (17)</option>
          </select>
        </div>

        <div class="editor-wrap" id="editorWrap">
          <div class="line-numbers" id="lineNumbers"></div>
          <div class="editor">
            <pre class="highlight-layer" id="highlightLayer" aria-hidden="true"></pre>
            <textarea id="codeEditor" spellcheck="false"></textarea>
          </div>
        </div>

        <div class="test-output collapsed" id="testOutput">
          <button class="output-toggle" id="outputToggle">
            <span>⌃</span> Test Cases &amp; Output
          </button>
          <div class="output-content" id="outputContent"></div>
        </div>

        <footer class="bottom-bar">
          <button class="run-btn" id="runBtn">▶ RUN SOLUTION</button>
          <button class="next-btn" id="nextBtn">NEXT</button>
          <button class="prev-btn" id="prevBtn">PREVIOUS</button>
          <!-- <button class="next-btn" id="nextBtn">NEXT</button> -->
        </footer>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
